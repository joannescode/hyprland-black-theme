# ~/.config/fuzzel/fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
icons-enabled=true
hide-before-typing=false

anchor=center
width=25
lines=4
horizontal-pad=30
vertical-pad=20
inner-pad=12

[colors]
background=000000cc
text=ffffffff
match=ccccccff
selection=ffffff22
selection-text=ffffffff
border=ffffffff

[border]
width=1
radius=8

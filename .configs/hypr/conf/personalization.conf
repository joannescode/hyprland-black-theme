# Janelas, geral (bordas, cores da borda, divisão etc)
general {
    gaps_in = 2
    gaps_out = 3
    border_size = 2
    col.active_border = rgba(ffffffdd) rgba(000000dd) 45deg
    col.inactive_border = rgba(444444aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# + Janelas, personalização externa e interna
decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 0.95
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 5
        render_power = 3
        color = rgba(000000aa)
    }

    blur {
        enabled = true
        size = 6
        passes = 1
        new_optimizations = true
        noise = 0.01
        contrast = 1.0
        brightness = 1.0
    }

}

# Animações para as janelas
animations {
    enabled = yes

    bezier = fastOut,        0.25, 1,    0.5, 1
    bezier = smoothInOut,    0.45, 0,    0.55, 1
    bezier = linear,         0,    0,    1,    1
    bezier = snappy,         0.16, 1,    0.3, 1

    animation = global,        1,     8,     smoothInOut
    animation = border,        1,     6,     fastOut
    animation = windows,       1,     6.5,   fastOut
    animation = windowsIn,     1,     5.5,   snappy,       popin 90%
    animation = windowsOut,    1,     2.2,   linear,       popin 85%
    animation = fadeIn,        1,     2.3,   smoothInOut
    animation = fadeOut,       1,     1.9,   smoothInOut
    animation = fade,          1,     2.5,   smoothInOut
    animation = layers,        1,     5,     smoothInOut
    animation = layersIn,      1,     5.2,   fastOut,      fade
    animation = layersOut,     1,     2.1,   linear,       fade
    animation = fadeLayersIn,  1,     2.2,   smoothInOut
    animation = fadeLayersOut, 1,     1.8,   smoothInOut
    animation = workspaces,    1,     2.8,   smoothInOut,  fade
    animation = workspacesIn,  1,     2.2,   smoothInOut,  fade
    animation = workspacesOut, 1,     2.8,   smoothInOut,  fade
    animation = zoomFactor,    1,     8,     snappy
}

